name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    env:
      COVERAGE_THRESHOLD: "70"
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Format
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race ./... -coverprofile=coverage.out
      - name: Coverage
        run: |
          go tool cover -func=coverage.out | tee coverage.txt
          LC_ALL=C awk -v threshold="$COVERAGE_THRESHOLD" '
            /^total:/ { coverage = $3; sub(/%$/, "", coverage) }
            END {
              if (coverage == "") {
                print "total coverage was not reported" > "/dev/stderr"
                exit 1
              }
              if (coverage + 0 < threshold + 0) {
                printf "total coverage %s%% is below the %s%% threshold\n", coverage, threshold > "/dev/stderr"
                exit 1
              }
            }
          ' coverage.txt
      - name: Build
        run: go build ./...

  # docs/renders holds the before/after captures the redesign is argued from.
  # Generated evidence that nothing re-checks goes stale in silence - the
  # captures kept showing a headline the binary had stopped printing, and no
  # test could notice - so the pair is rebuilt here from the released tag and
  # from HEAD, and a difference fails the build.
  #
  # fetch-depth 0 because the "before" side is built from a tag.
  renders:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Captures match the binaries
        run: make renders-check
