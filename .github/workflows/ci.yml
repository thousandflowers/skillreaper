name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    env:
      COVERAGE_THRESHOLD: "72.5"
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Format
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race ./... -coverprofile=coverage.out
      - name: Coverage
        run: |
          go tool cover -func=coverage.out | tee coverage.txt
          awk -v threshold="$COVERAGE_THRESHOLD" '
            /^total:/ { coverage = $3; sub(/%$/, "", coverage) }
            END {
              if (coverage == "") {
                print "total coverage was not reported" > "/dev/stderr"
                exit 1
              }
              if (coverage + 0 < threshold + 0) {
                printf "total coverage %s%% is below the %s%% threshold\n", coverage, threshold > "/dev/stderr"
                exit 1
              }
            }
          ' coverage.txt
      - name: Build
        run: go build ./...
