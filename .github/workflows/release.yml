name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # Assert the tap credential works before anything becomes public.
  #
  # The tap is a public repo, so homebrew-tap's checkout succeeds without any
  # credential and only its final `git push` fails. A dead or read-only GH_PAT
  # is therefore invisible until the GitHub release and the npm package are
  # already out, leaving `brew install` serving the previous version from a
  # stale formula. A green run is not evidence the token works either — it only
  # means the push step happened to be reached.
  #
  # `gh api` returns a permissions object computed for the authenticated token,
  # so an expired token fails outright and a read-only one reports push=false.
  # Either way the run stops in seconds with nothing published to undo.
  preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Assert GH_PAT can push to the tap
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail
          push=$(gh api repos/thousandflowers/homebrew-tap --jq '.permissions.push')
          [ "$push" = "true" ] || {
            echo "GH_PAT cannot push to thousandflowers/homebrew-tap (permissions.push=$push)" >&2
            exit 1
          }
          echo "GH_PAT can push to the tap"

  goreleaser:
    runs-on: ubuntu-latest
    needs: preflight
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  homebrew-tap:
    runs-on: ubuntu-latest
    needs: goreleaser
    steps:
      - uses: actions/checkout@v6
        with:
          repository: thousandflowers/homebrew-tap
          token: ${{ secrets.GH_PAT }}
      - name: Update formula for ${{ github.ref_name }}
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${TAG#v}"
          cd Formula

          # fetch checksums from the release
          gh release download "$TAG" \
            --repo thousandflowers/skillreaper \
            -p "checksums.txt" \
            --output /tmp/checksums.txt

          # bump version (urls interpolate v#{version}, no url rewrite needed)
          sed -i "s/version \"[0-9.]*\"/version \"${VERSION}\"/" skillreaper.rb

          # set each stanza's sha256 from its own checksum: match the url
          # line by platform, then rewrite the sha256 line that follows it
          for platform in darwin_amd64 darwin_arm64 linux_amd64 linux_arm64; do
            sha=$(grep "skillreaper_${platform}.tar.gz" /tmp/checksums.txt | cut -d' ' -f1)
            [ -n "$sha" ] || { echo "missing checksum for ${platform}" >&2; exit 1; }
            sed -i "\\|skillreaper_${platform}.tar.gz|{n;s|sha256 \"[a-f0-9]*\"|sha256 \"${sha}\"|;}" skillreaper.rb
          done

          git config user.name "skillreaper-bot"
          git config user.email "bot@skillreaper.dev"
          git add skillreaper.rb
          git commit -m "Update skillreaper to ${TAG}"
          git push

  # Publishes with npm Trusted Publishing: the registry trusts this workflow in
  # this repository over OIDC and mints a short-lived credential per run. No
  # long-lived NPM_TOKEN to rotate, to leak, or to discover has expired at the
  # worst possible moment.
  #
  # PREREQUISITE this job cannot check for you: the trusted publisher must
  # already exist on npmjs.com for the skillreaper package, pointing at
  # thousandflowers/skillreaper and release.yml. Until it does, this job fails
  # at `npm publish` — and by then the GitHub release is already public.
  #
  # node-version is 24, not 22, and that is load-bearing: trusted publishing
  # needs npm >= 11.5.1, while the current v22 line still bundles npm 10.9.8.
  npm-publish:
    runs-on: ubuntu-latest
    needs: goreleaser
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Publish to npm
        run: |
          cd npm
          VERSION="${GITHUB_REF_NAME#v}"
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          npm publish
